<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Feuille de notes Cluedo — éliminez et marquez vos cartes.">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cluedo Notes">
    <title>Cluedo Notes</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        (function () {
            var t = localStorage.getItem("cluedo_theme");
            if (t === "light" || t === "dark") {
                document.documentElement.setAttribute("data-theme", t);
            } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                document.documentElement.setAttribute("data-theme", "dark");
            } else {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
</head>
<body>

    <header class="header">
        <h1>CLUEDO</h1>
        <button type="button" id="menuBtn" class="menu-btn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="burgerMenu">
            <span class="menu-btn__bar"></span>
            <span class="menu-btn__bar"></span>
            <span class="menu-btn__bar"></span>
        </button>
        <nav id="burgerMenu" class="burger-menu" hidden>
            <button type="button" id="undoBtn" class="burger-menu__item" disabled>Annuler</button>
            <button type="button" id="resetBtn" class="burger-menu__item">Reset</button>
            <button type="button" id="themeBtn" class="burger-menu__item">🌙 Mode sombre</button>
        </nav>
    </header>

    <div class="tabs-wrapper">
        <nav class="tabs-nav" id="tabsNav" aria-label="Catégories">
            <button type="button" class="tab-btn is-active" data-tab="0">🃏 Main</button>
            <button type="button" class="tab-btn" data-tab="1">Suspects</button>
            <button type="button" class="tab-btn" data-tab="2">Armes</button>
            <button type="button" class="tab-btn" data-tab="3">Lieux</button>
        </nav>

        <div class="tabs-viewport" id="tabsViewport">
            <div class="tabs-track" id="tabsTrack">
                <section class="tab-panel" id="panel-hand" aria-label="Mes cartes en main"></section>
                <section class="tab-panel" id="panel-suspects" aria-label="Suspects"></section>
                <section class="tab-panel" id="panel-armes" aria-label="Armes"></section>
                <section class="tab-panel" id="panel-lieux" aria-label="Lieux"></section>
            </div>
        </div>
    </div>

    <div id="menuBackdrop" class="menu-backdrop" hidden></div>

    <div id="show-card-overlay">
        <svg class="detective-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M56,12V8H52v4H12V8H8v4A24,24,0,0,0,8,60V56h4v4H52V56h4v4a24,24,0,0,0,0-48ZM32,56A20,20,0,1,1,52,36,20,20,0,0,1,32,56Z"/>
            <path d="M28,24a8,8,0,0,1,8,8h4a12,12,0,0,0-12-12Z"/>
            <circle cx="32" cy="36" r="4"/>
            <path d="M48,48l6.3,6.3a1,1,0,0,0,1.4,0l2-2a1,1,0,0,0,0-1.4L51.4,44.6A24,24,0,0,0,32,12C18.8,12,8,22.8,8,36S18.8,60,32,60a23.9,23.9,0,0,0,16-6.1Z"/>
        </svg>
        <h2 id="card-display-name">---</h2>
        <div class="hint">Touchez pour fermer</div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
